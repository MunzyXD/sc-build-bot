name: Android APK Build
on:
  workflow_dispatch:
    inputs:
      variant:
        description: APK build variant
        required: true
        type: choice
        options: [debug, release]
        default: debug
      build_id:
        description: Unique build ID
        required: true
        type: string
      artifact_name:
        description: Artifact name
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate inputs
        shell: bash
        env:
          BUILD_ID: ${{ inputs.build_id }}
          VARIANT: ${{ inputs.variant }}
        run: |
          [[ "$BUILD_ID" =~ ^[A-Fa-f0-9]{6,16}$ ]] || exit 1
          [[ "$VARIANT" == "debug" || "$VARIANT" == "release" ]] || exit 1
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate Android project
        run: |
          test -f android-app/settings.gradle
          test -f android-app/app/build.gradle
      - name: Resolve dependencies
        run: gradle -p android-app dependencies --no-daemon
      - name: Compile APK
        shell: bash
        env:
          VARIANT: ${{ inputs.variant }}
        run: |
          set -o pipefail
          if [[ "$VARIANT" == "release" ]]; then
            gradle -p android-app assembleRelease --no-daemon --stacktrace 2>&1 | tee build-output.log
          else
            gradle -p android-app assembleDebug --no-daemon --stacktrace 2>&1 | tee build-output.log
          fi
      - name: Validate APK output
        shell: bash
        run: |
          mapfile -t apks < <(find android-app -type f -path "*/build/outputs/apk/*" -name "*.apk" -size +0c)
          test "${#apks[@]}" -gt 0
          printf '%s\n' "${apks[@]}"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: android-app/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 3
          compression-level: 1
      - name: Write build summary
        if: always()
        env:
          BUILD_ID: ${{ inputs.build_id }}
          VARIANT: ${{ inputs.variant }}
        run: |
          {
            echo "## Android APK Build"
            echo "- Build ID: $BUILD_ID"
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Variant: $VARIANT"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare failure summary
        if: failure()
        shell: bash
        run: |
          if [[ -f build-output.log ]]; then
            sed -E -e 's/(gh[pousr]_[A-Za-z0-9_]{20,})/[REDACTED_TOKEN]/g' -e 's/(github_pat_[A-Za-z0-9_]{20,})/[REDACTED_TOKEN]/g' build-output.log | grep -Ei 'error|failed|exception|could not|unable to' | tail -n 80 > failure-summary.txt || true
          else
            echo "Build failed before Gradle output was generated." > failure-summary.txt
          fi
      - name: Upload failure summary
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-error-${{ inputs.build_id }}
          path: failure-summary.txt
          if-no-files-found: warn
          retention-days: 3
